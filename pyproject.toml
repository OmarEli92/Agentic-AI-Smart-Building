[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bim-iot"
version = "0.1.0"
description = "LLM based agentic system for Smart Building decision support and actuation."
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.5,<2",
    "langchain-groq>=1.1,<2",
    "langchain-openrouter>=0.2,<1",
    "langchain-openai>=1.4,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "neo4j>=6,<7",
    "rdflib[graphdb]>=7.6,<8",
    "neo4j-graphrag>=1.16,<2",
    "rdflib-neo4j==1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_bim_iot"]