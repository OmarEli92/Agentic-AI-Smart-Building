[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bim-iot"
version = "0.1.0"
description = "LLM-based agentic system for smart-building decision support and actuation."
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph>=1.2.10,<2.0",
    "langchain-openrouter>=0.2.7,<0.3",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.9,<3.0",
    "streamlit>=1.45,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"] 

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_bim_iot"]