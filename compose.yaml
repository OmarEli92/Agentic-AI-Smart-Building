name: agentic-smart-building

services:
  graphdb:
    image: ontotext/graphdb:10.7.0
    restart: unless-stopped

    ports:
      - "7200:7200"

    volumes:
      - graphdb_data:/opt/graphdb/home


  neo4j:
    image: neo4j:5.26
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
  
  thingsboard-postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${THINGSBOARD_POSTGRES_PASSWORD}"

    volumes:
      - thingsboard_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.3
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "1883:1883"

    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://thingsboard-postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "${THINGSBOARD_POSTGRES_PASSWORD}"
      TB_QUEUE_TYPE: in-memory

    depends_on:
      thingsboard-postgres:
        condition: service_healthy
  
  

volumes:
  graphdb_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  thingsboard_postgres_data:
 